# Open-weight model configuration (spec section 6).
# Default preset targets the LOCAL NVIDIA T1000 8GB (Turing, compute 7.5).
# Turing has no efficient bf16 -> use float16 locally. On Colab (Ampere+),
# switch to the "colab" preset (bfloat16, larger model).

model:
  # Local 8GB preset (fits FP16, standard model.model.layers structure):
  model_id: "Qwen/Qwen2.5-3B-Instruct"
  dtype: "float16"          # T1000/Turing: float16 (NOT bfloat16)
  device_map: "cuda"        # "cpu" for control/FP32 runs
  trust_remote_code: false
  use_cache: false          # off for clean activation capture
  quantization: null        # disabled in main experiments (spec section 6)
  seed: 12345
  max_new_tokens: 8
  temperature: 0.0          # deterministic measurement

# Alternative presets (copy into `model:` to use):
presets:
  local_t1000_8gb:
    model_id: "Qwen/Qwen2.5-3B-Instruct"
    dtype: "float16"
    device_map: "cuda"
  local_small_ci:
    model_id: "Qwen/Qwen2.5-1.5B-Instruct"
    dtype: "float16"
    device_map: "cuda"
  control_fp32_cpu:
    model_id: "Qwen/Qwen2.5-1.5B-Instruct"
    dtype: "float32"
    device_map: "cpu"

  # --- Multi-model comparison trio (Colab A100 40GB, bf16). ---
  # Ministral & Gemma are GATED: accept the license on their HF page and set
  # HF_TOKEN before running. Qwen3 is open.
  cn_qwen3_8b:            # China — Alibaba, Apache-2.0, open
    model_id: "Qwen/Qwen3-8B"
    dtype: "bfloat16"
    device_map: "auto"
  eu_ministral3_8b:      # Europe — Mistral (FR), gated
    model_id: "mistralai/Ministral-8B-Instruct-2410"
    dtype: "bfloat16"
    device_map: "auto"
  us_gemma4_12b:         # USA — Google, gated (dense; Gemma has no 8B dense)
    model_id: "google/gemma-4-12B"
    dtype: "bfloat16"
    device_map: "auto"

# The multi-model runner reads this list (scripts/run_all_models.py --preset trio):
model_trio:
  - "Qwen/Qwen3-8B"
  - "mistralai/Ministral-8B-Instruct-2410"
  - "google/gemma-4-12B"

# --- Medical vs base comparison (does medical fine-tuning act like a permanent
#     "oncologo role"? dampen emotionality? change coding?). MedGemma is Gemma-3
#     based, so the base is the same architecture -> a clean controlled pair.
#     Gemma-3 is multimodal; the adapter now loads the text tower automatically.
# 27B pair — needs H100 80GB (bf16 ~54GB each); MedGemma text-only loads cleanly:
med_base_gemma3_27b:
  model_id: "google/gemma-3-27b-it"
  dtype: "bfloat16"
  device_map: "auto"
med_medgemma_27b:
  model_id: "google/medgemma-27b-text-it"
  dtype: "bfloat16"
  device_map: "auto"
# 4B pair — fits A100 40GB (both multimodal; adapter loads the text tower):
med_base_gemma3_4b:
  model_id: "google/gemma-3-4b-it"
  dtype: "bfloat16"
  device_map: "auto"
med_medgemma_4b:
  model_id: "google/medgemma-4b-it"
  dtype: "bfloat16"
  device_map: "auto"

# Base <-> medical pairs for scripts/run_all_models.py --models "${...}":
medical_pair_27b:   # H100 80GB
  - "google/gemma-3-27b-it"
  - "google/medgemma-27b-text-it"
medical_pair_4b:    # A100 40GB
  - "google/gemma-3-4b-it"
  - "google/medgemma-4b-it"

# --- Fully-Open Meditron (EPFL): European multilingual bases medicalized, fully
#     auditable. BEST for the ITALIAN task — EuroLLM/Apertus handle Italian natively,
#     unlike the English-centric MedGemma. MeditronFO ids verified from the official
#     EPFLiGHT/meditronfo collection; confirm the base ids on HF if a 404 occurs.
# EuroLLM 9B (European multilingual incl. Italian) — A100 40GB:
med_base_eurollm_9b:
  model_id: "utter-project/EuroLLM-9B-Instruct"
  dtype: "bfloat16"
  device_map: "auto"
med_eurollm_9b_meditronfo:
  model_id: "EPFLiGHT/EuroLLM-9B-MeditronFO"
  dtype: "bfloat16"
  device_map: "auto"
# Apertus 8B (Swiss, fully open, multilingual) — A100 40GB.
#   (Apertus is a newer arch; may need trust_remote_code — see notebook cell 8d.)
med_base_apertus_8b:
  model_id: "swiss-ai/Apertus-8B-Instruct-2509"
  dtype: "bfloat16"
  device_map: "auto"
med_apertus_8b_meditronfo:
  model_id: "EPFLiGHT/Apertus-8B-MeditronFO"
  dtype: "bfloat16"
  device_map: "auto"
# Gemma-3-27B MeditronFO — SAME base as MedGemma, so two different medicalizations
# (Google MedGemma vs EPFL MeditronFO) of one base can be compared. H100 80GB:
med_gemma3_27b_meditronfo:
  model_id: "EPFLiGHT/Gemma-3-27B-MeditronFO"
  dtype: "bfloat16"
  device_map: "auto"

medical_pair_eurollm_9b:   # A100 40GB — ITALIAN-native base
  - "utter-project/EuroLLM-9B-Instruct"
  - "EPFLiGHT/EuroLLM-9B-MeditronFO"
medical_pair_apertus_8b:   # A100 40GB — fully open, multilingual
  - "swiss-ai/Apertus-8B-Instruct-2509"
  - "EPFLiGHT/Apertus-8B-MeditronFO"
medical_trio_gemma3_27b:   # H100 80GB — base vs MedGemma (Google) vs MeditronFO (EPFL)
  - "google/gemma-3-27b-it"
  - "google/medgemma-27b-text-it"
  - "EPFLiGHT/Gemma-3-27B-MeditronFO"
