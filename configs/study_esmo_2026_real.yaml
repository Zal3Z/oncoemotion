protocol_id: "esmo-ai-2026-real-v1"
title: "Independent affective representations in clinician-validated oncology free text"

design:
  roles: ["oncologo", "none_filler"]
  arms: ["intact"]
  expected_records_per_model: 1275
  expected_rows_per_model: 2550
  readout_primary: "z_read"
  readout_secondary: "z"

source_expectations:
  term_records: 968
  no_direct_pro_match_records: 245
  insufficient_context_records: 62
  distinct_pro_ids: 63
  unique_source_ids: 996
  records_ge_7_words: 127
  # Identical strings may carry different valid assessment labels. They are retained
  # as separate rows and clustered by source_id, never collapsed blindly.
  cluster_field: "source_id"

models:
  analysis_policy: "complete_primary_secondary_descriptive"
  primary:
    - "swiss-ai/Apertus-8B-Instruct-2509"
    - "EPFLiGHT/Apertus-8B-MeditronFO"
    - "utter-project/EuroLLM-9B-Instruct"
    - "EPFLiGHT/EuroLLM-9B-MeditronFO"
    - "Qwen/Qwen3-8B"
    - "mistralai/Ministral-8B-Instruct-2410"
    - "google/gemma-3-27b-it"
    - "EPFLiGHT/Gemma-3-27B-MeditronFO"
  secondary:
    - "google/medgemma-27b-text-it"
    - "google/gemma-3-4b-it"
    - "google/medgemma-4b-it"

primary:
  population: "term"
  role: "oncologo"
  control: "none_filler"
  arm: "intact"
  outcome: "within_item_and_grade_residual_error_association"
  affect_composite: ["afraid_alarmed", "concerned"]
  effect_scale: "absolute error-probability difference per within-model SD"

secondary:
  - "within_item_emotion_slope_per_grade"
  - "role_conditioned_affect_shift"
  - "role_conditioned_top1_disagreement"
  - "macro_recall_across_gold_pro_items"
  - "generative_abstention_on_non_PRO_rows"
  - "long_text_sensitivity_ge_7_words"

analysis:
  bootstrap_draws: 5000
  seed: 20261001
  confidence_level: 0.95
  cluster_field: "source_id"
  equal_model_weighting: true
  retain_all_assessment_rows: true
  conflicting_identical_texts_sensitivity: true

scoring:
  committed_label: "constrained"
  abstention_outcome: "generative"
  execution_policy: "adaptive_by_gold_class"

affective_profile:
  concepts:
    - afraid_alarmed
    - anxious_nervous
    - concerned
    - sad
    - anger
    - calm
    - hope
    - relief
  primary_axes: ["afraid_alarmed", "concerned"]
  lexical_cosine_max: 0.50
  min_cross_validated_auroc: 0.60
  min_cross_validated_positive_examples: 60
  eligibility_policy: "per_model"
  shared_layer_selection: "requested_axes_only"
  readouts: ["z_read", "z"]
  controls:
    - clinical_severity
    - general_negative_valence
    - urgency
    - uncertainty

# The real study is observational at the text level. Causal claims remain confined
# to the separate neutral/emotional paired stress test.
mechanistic_gate:
  enabled: false
  target_axes: ["afraid_alarmed", "concerned"]

model_pairs:
  primary:
    - family: "Apertus-8B"
      base: "swiss-ai/Apertus-8B-Instruct-2509"
      medicalized: "EPFLiGHT/Apertus-8B-MeditronFO"
    - family: "EuroLLM-9B"
      base: "utter-project/EuroLLM-9B-Instruct"
      medicalized: "EPFLiGHT/EuroLLM-9B-MeditronFO"
    - family: "Gemma-3-27B-MeditronFO"
      base: "google/gemma-3-27b-it"
      medicalized: "EPFLiGHT/Gemma-3-27B-MeditronFO"
  secondary:
    - family: "Gemma-3-27B-MedGemma"
      base: "google/gemma-3-27b-it"
      medicalized: "google/medgemma-27b-text-it"
    - family: "Gemma-3-4B-MedGemma"
      base: "google/gemma-3-4b-it"
      medicalized: "google/medgemma-4b-it"
