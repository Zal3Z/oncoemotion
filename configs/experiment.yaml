# Experiment configuration (spec sections 7-13).

mapping:
  thresholds:
    tau_exact: 0.90
    tau_low: 0.60
    margin_clear: 0.12
    abstain_below: 0.60
    exclusion_fuzzy: 0.90
  include_synthetic_terms: true   # use synthetic Italian seeds (dev). Set false
                                  # once official/reviewed data is loaded.
  use_embeddings: false
  use_reranker: false
  ctcae_allow_synthetic: true
  language: "it"

# Autoritativi sono i seed in src/oncoemotion/emotion_vectors/seeds.py: il codice
# legge quelli, non questo file. Queste liste erano ferme a 9 emozioni e 11
# controlli mentre il codice ne spediva 25 e 7, ed elencavano concetti (harmfulness,
# novelty, lexical_difficulty, decision_conflict, response_refusal, text_length)
# che non sono mai esistiti nei seed. Rigenerate da seeds.py.
emotion_concepts:
  - afraid_alarmed
  - concerned
  - calm
  - surprised
  - confused
  - frustrated
  - compassionate
  - sad
  - anxious_nervous
  - joy_happy
  - anger
  - disgust
  - shame
  - guilt
  - pride
  - gratitude
  - hope
  - relief
  - excitement
  - love_affection
  - loneliness
  - disappointment
  - embarrassment
  - curiosity
  - boredom

control_concepts:            # confondenti, residualizzati via dalle emozioni
  - uncertainty
  - urgency
  - clinical_severity
  - safety_policy
  - general_negative_valence

lexical_controls:            # MISURATI contro gli assi emotivi, mai residualizzati
                             # via: sono il cancello ontologico
  - emotion_word_mention
  - emotion_negated

vector_methods:
  - diff_of_means
  - contrastive
  - pca
  - logistic
  - lda

extraction:
  min_examples_per_condition: 50   # 50-100 for the definitive run
  ci_examples_per_condition: 6     # tiny set for automated tests
  splits: { extraction: 0.6, validation: 0.2, test: 0.2 }

measurement_points:          # spec section 10
  - A_before_field
  - B_last_token_field
  - C_after_neutral_sentence
  - D_after_candidate_list
  - E_pre_decision            # PRIMARY measurement point
  - F_first_token_of_term
  - G_after_decision
teacher_forcing_prefix: '{"pro_ctcae":{"term":"'

steering:
  alpha_grid: [-0.10, -0.05, -0.02, 0.00, 0.02, 0.05, 0.10]
  targets: [residual, mlp, attn]
  token_scopes: [all_post, pre_decision]

statistics:
  n_boot: 2000
  ci: 0.95
  seed: 12345
  multiple_comparison: benjamini_hochberg
