[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oncoemotion"
version = "0.1.0"
description = "PRO-CTCAE/CTCAE mapping + emotion-concept mechanistic interpretability for oncology symptom free-text."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "oncoemotion project" }]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "numpy>=1.26",
    "rapidfuzz>=3",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.115", "uvicorn>=0.30", "ruff>=0.8"]
data = ["pandas>=2.2", "openpyxl>=3.1"]
# Heavy ML stack for Phases 2-4. Install separately; on the T1000 use a CUDA
# build of torch (cu121) and dtype=float16 (Turing has no efficient bf16).
ml = [
    "torch>=2.2",
    "transformers>=5.14.1",
    "accelerate>=0.33",
    "bitsandbytes>=0.49",
    "torchvision>=0.20",
    "pillow>=10",
    "sentence-transformers>=3.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "statsmodels>=0.14",
]
viz = ["streamlit>=1.36", "matplotlib>=3.8", "plotly>=5.20"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Keep the repository-wide check focused on correctness and import hygiene. More
# opinionated modernization rules can be introduced incrementally without making
# unrelated legacy modules fail the release gate.
select = ["E9", "F", "I"]
ignore = ["E402"]
